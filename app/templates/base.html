<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StudentLedger{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/students">
    <strong>StudentLedger</strong>
    <span>учёт успеваемости</span>
  </a>
  {% if current_user %}
  <nav class="mainnav">
    <a href="/students">Студенты</a>
    <span class="who">{{ current_user.login }} · {{ role_labels[current_user.role] }}</span>
    <form method="post" action="/logout">
      <button type="submit" class="link-button">Выйти</button>
    </form>
  </nav>
  {% endif %}
</header>
<main class="container">
  {% block content %}{% endblock %}
</main>
<footer class="footer">StudentLedger · лабораторная работа № 3</footer>
</body>
</html>
